<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- MediKiosk Cross & ECG Pulse Emblem (Light for Dark Backgrounds) -->
  <g transform="translate(8, 8)">
    <!-- Medical Cross in Crisp White -->
    <path
      d="M 23 9 A 6 6 0 0 1 29 3 L 35 3 A 6 6 0 0 1 41 9 L 41 23 L 55 23 A 6 6 0 0 1 61 29 L 61 35 A 6 6 0 0 1 55 41 L 41 41 L 41 55 A 6 6 0 0 1 35 61 L 29 61 A 6 6 0 0 1 23 55 L 23 41 L 9 41 A 6 6 0 0 1 3 35 L 3 29 A 6 6 0 0 1 9 23 L 23 23 Z"
      fill="#FFFFFF"
    />
    <!-- ECG / Voice Pulse Wave in Vibrant Rust/Orange -->
    <path
      d="M 5 32 L 20 32 L 24 28 L 29 12 L 35 52 L 40 22 L 44 32 L 59 32"
      stroke="#FB923C"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography Lockup with Stretched Letter-Spacing -->
  <g transform="translate(88, 12)">
    <!-- "MediKiosk" Wordmark -->
    <text
      x="0"
      y="31"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="30"
      font-weight="800"
      letter-spacing="0.045em"
    >
      <tspan fill="#FFFFFF">Medi</tspan><tspan fill="#FB923C">Kiosk</tspan>
    </text>

    <!-- "CLINICAL CARE" Subtitle -->
    <text
      x="1"
      y="49"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="12"
      font-weight="600"
      letter-spacing="0.22em"
      fill="#9CA3AF"
    >
      CLINICAL CARE
    </text>
  </g>
</svg>
