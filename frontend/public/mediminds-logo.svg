<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Minimal Flat Cross & Pulse Emblem -->
  <g transform="translate(10, 8)">
    <!-- Solid Rounded Medical Cross in Cobalt Navy -->
    <path
      d="M 23 9 A 6 6 0 0 1 29 3 L 35 3 A 6 6 0 0 1 41 9 L 41 23 L 55 23 A 6 6 0 0 1 61 29 L 61 35 A 6 6 0 0 1 55 41 L 41 41 L 41 55 A 6 6 0 0 1 35 61 L 29 61 A 6 6 0 0 1 23 55 L 23 41 L 9 41 A 6 6 0 0 1 3 35 L 3 29 A 6 6 0 0 1 9 23 L 23 23 Z"
      fill="#1D2A8F"
    />
    <!-- Clean Solid Pulse Line in Rust -->
    <path
      d="M 5 32 L 20 32 L 24 28 L 29 12 L 35 52 L 40 22 L 44 32 L 59 32"
      stroke="#C2410C"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Clean, Non-Bold Typography Lockup -->
  <g transform="translate(86, 14)">
    <!-- "MediMinds" Wordmark in Medium / Semi-Bold Weight -->
    <text
      x="0"
      y="28"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="26"
      font-weight="600"
      letter-spacing="-0.01em"
    >
      <tspan fill="#1D2A8F">Medi</tspan><tspan fill="#C2410C">Minds</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text
      x="1"
      y="46"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="10.5"
      font-weight="500"
      letter-spacing="0.16em"
      fill="#756F73"
    >
      CLINICAL INTELLIGENCE
    </text>
  </g>
</svg>
