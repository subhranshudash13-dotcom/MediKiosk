<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- ============================================================== -->
  <!-- MEDIKIOSK — OFFICIAL VECTOR LOGO (HORIZONTAL LOCKUP)           -->
  <!-- Concept: The Resonance Cross (Clinical Cross + Voice/Pulse)   -->
  <!-- ============================================================== -->
  
  <defs>
    <!-- Subtle gradient for pulse vitality -->
    <linearGradient id="mk-pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00a3ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g id="mk-symbol" transform="translate(10, 10)">
    <!-- Architectural Rounded Medical Cross -->
    <path d="M 37 18 A 8 8 0 0 1 45 10 L 55 10 A 8 8 0 0 1 63 18 L 63 37 L 82 37 A 8 8 0 0 1 90 45 L 90 55 A 8 8 0 0 1 82 63 L 63 63 L 63 82 A 8 8 0 0 1 55 90 L 45 90 A 8 8 0 0 1 37 82 L 37 63 L 18 63 A 8 8 0 0 1 10 55 L 10 45 A 8 8 0 0 1 18 37 L 37 37 Z" fill="#0f172a"/>
    
    <!-- Active Voice Intake & Vital Triage Waveform -->
    <path d="M 12 50 L 35 50 L 40 45 L 46 22 L 54 78 L 60 36 L 65 50 L 88 50" stroke="url(#mk-pulse-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g id="mk-brandtext" transform="translate(130, 0)">
    <!-- Primary Brandmark Wordmark -->
    <text x="0" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#0f172a" letter-spacing="-1.5">Medi<tspan fill="#0284c7">Kiosk</tspan></text>
    
    <!-- Active Clinical Status Beacon Dot -->
    <circle cx="230" cy="46" r="4.5" fill="#10b981"/>
    <circle cx="230" cy="46" r="2" fill="#ffffff"/>

    <!-- Clinical Tagline / Mission Descriptor -->
    <text x="2" y="94" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#64748b" letter-spacing="3.2">INTELLIGENT OPD INTAKE &amp; TRIAGE</text>
  </g>
</svg>
